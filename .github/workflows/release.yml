name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v1.0.0)
        required: true
        type: string
      publish:
        description: Publish the verified distributions to PyPI
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  checks:
    name: Verify the tagged commit
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.checks.outputs.sha }}
      version: ${{ steps.checks.outputs.version }}
      wheels_run: ${{ steps.checks.outputs.wheels_run }}
    steps:
      - name: Require successful main checks for the exact tag commit
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a release tag of the form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          sha=$(gh api "repos/$REPOSITORY/commits/$TAG" --jq .sha)
          status=$(gh api "repos/$REPOSITORY/compare/$sha...main" --jq .status)
          if [[ "$status" != identical && "$status" != ahead ]]; then
            echo "The tag must point to a commit on main." >&2
            exit 1
          fi

          pending=(ci.yml codeql.yml wheels.yml)
          while (( ${#pending[@]} > 0 )); do
            remaining=()
            for workflow in "${pending[@]}"; do
              run=$(gh api --method GET "repos/$REPOSITORY/actions/workflows/$workflow/runs" \
                -f branch=main -f event=push -f head_sha="$sha" -f per_page=1 \
                --jq '.workflow_runs[0] | select(. != null) | [.id, .status, .conclusion] | @tsv')
              IFS=$'\t' read -r id state conclusion <<< "$run"
              if [[ "$state" != completed ]]; then
                remaining+=("$workflow")
                continue
              fi
              if [[ "$conclusion" != success ]]; then
                echo "$workflow failed for $sha: https://github.com/$REPOSITORY/actions/runs/$id" >&2
                exit 1
              fi
              echo "$workflow passed: https://github.com/$REPOSITORY/actions/runs/$id"
              if [[ "$workflow" == wheels.yml ]]; then
                printf 'wheels_run=%s\n' "$id" >> "$GITHUB_OUTPUT"
              fi
            done
            pending=("${remaining[@]}")
            if (( ${#pending[@]} > 0 )); then
              sleep 20
            fi
          done

          printf 'sha=%s\nversion=%s\n' "$sha" "${TAG#v}" >> "$GITHUB_OUTPUT"

  distributions:
    name: Verify release distributions
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require all seven distribution artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WHEELS_RUN: ${{ needs.checks.outputs.wheels_run }}
        run: |
          artifacts=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$WHEELS_RUN/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .name')
          for name in sdist wheels-linux-{x86_64,aarch64} wheels-macos-{x86_64,arm64} wheels-windows-{amd64,arm64}; do
            if ! grep -Fxq "$name" <<< "$artifacts"; then
              echo "Missing or expired artifact: $name" >&2
              exit 1
            fi
          done

      - name: Download tested wheels from the successful Wheels run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.checks.outputs.wheels_run }}
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Download the source distribution from the successful Wheels run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.checks.outputs.wheels_run }}
          name: sdist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Verify distribution metadata against the tag
        env:
          RELEASE_VERSION: ${{ needs.checks.outputs.version }}
        run: |
          python -m pip install "twine>=6,<7"
          python -m twine check --strict dist/*
          python - <<'PY'
          from pathlib import Path
          from os import environ
          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version
          from twine.package import PackageFile

          package = "flowcoord"
          version = Version(environ["RELEASE_VERSION"])
          files = sorted(path for path in Path("dist").iterdir() if not path.name.startswith("."))
          wheels = [path for path in files if path.suffix == ".whl"]
          sdists = [path for path in files if path.name.endswith(".tar.gz")]
          if not wheels or len(sdists) != 1 or len(files) != len(wheels) + 1:
              raise SystemExit(f"Expected wheels and exactly one source distribution: {files}")
          for path in files:
              parse = parse_wheel_filename if path.suffix == ".whl" else parse_sdist_filename
              name, file_version, *_ = parse(path.name)
              metadata = PackageFile.from_filename(str(path), comment=None).metadata
              if (
                  name != package
                  or file_version != version
                  or metadata["name"] != package
                  or Version(metadata["version"]) != version
              ):
                  raise SystemExit(f"Distribution does not match {package} {version}: {path.name}")
          PY

      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish to PyPI
    needs: distributions
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
