[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flowcoord"
version = "0.1.0"
description = "FlowCoord: concurrency, resilience, scheduling, and resource ownership."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TahsinCr", email = "Tahsincr@outlook.com" }]
dependencies = [
  "exceptiongroup>=1.3.1,<2; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/TahsinCr/python-flowcoord"
Changelog = "https://github.com/TahsinCr/python-flowcoord/blob/main/CHANGELOG.md"
Issues = "https://github.com/TahsinCr/python-flowcoord/issues"

[project.optional-dependencies]
dev = [
  "pyperf>=2.7,<3",
  "pyright>=1.1.400,<2",
  "ruff>=0.12,<1",
  "setuptools>=77",
]

[tool.setuptools]
packages = ["flowcoord"]

[tool.setuptools.package-data]
flowcoord = ["py.typed", "_core.pyi"]

[tool.setuptools.exclude-package-data]
flowcoord = ["*.c"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".serena", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "I", "UP", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B023"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["flowcoord"]
exclude = ["tests"]

[tool.cibuildwheel]
build-verbosity = 1
skip = ["pp*", "*-manylinux_i686", "*-musllinux_i686", "*-win32"]
test-command = [
  "python -c \"import sys, sysconfig; from flowcoord._native import CORE; assert CORE is not None; assert not sysconfig.get_config_var('Py_GIL_DISABLED') or not sys._is_gil_enabled()\"",
  "python -m unittest discover -s \"{project}/tests\" -p test_native_core.py",
]
